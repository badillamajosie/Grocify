{% extends "base.html" %}

{% block title %}Add Student | Student Management System{% endblock %}

{% block content %}
  <section class="page-head">
    <div>
      <p class="eyebrow">New record</p>
      <h1>Add a new student</h1>
      <p class="page-subtitle">Fill in every field below. All fields are required.</p>
    </div>
    <a href="{{ url_for('students_page') }}" class="btn btn-ghost">← Back to students</a>
  </section>

  <section class="panel form-panel">
    <form method="post" action="{{ url_for('add_student') }}">
      <div class="form-grid">
        <div class="form-group">
          <label for="student_id">Student ID</label>
          <input
            type="text"
            id="student_id"
            name="student_id"
            value="{{ form.get('student_id', '') }}"
            placeholder="e.g. 2024-0004"
            required
          >
          <p class="help-text">Must be unique. Letters, numbers and dashes only.</p>
        </div>

        <div class="form-group">
          <label for="full_name">Full name</label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            value="{{ form.get('full_name', '') }}"
            placeholder="e.g. Juan Dela Cruz"
            required
          >
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input
            type="number"
            id="age"
            name="age"
            value="{{ form.get('age', '') }}"
            placeholder="e.g. 20"
            min="10"
            max="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="" disabled {% if not form.get('gender') %}selected{% endif %}>Select gender</option>
            {% for gender in genders %}
              <option value="{{ gender }}" {% if form.get('gender') == gender %}selected{% endif %}>{{ gender }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="course">Course</label>
          <input
            type="text"
            id="course"
            name="course"
            value="{{ form.get('course', '') }}"
            placeholder="e.g. BS Information Technology"
            required
          >
        </div>

        <div class="form-group">
          <label for="year_level">Year level</label>
          <select id="year_level" name="year_level" required>
            <option value="" disabled {% if not form.get('year_level') %}selected{% endif %}>Select year level</option>
            {% for level in year_levels %}
              <option value="{{ level }}" {% if form.get('year_level') == level %}selected{% endif %}>{{ level }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group form-group-full">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            value="{{ form.get('email', '') }}"
            placeholder="e.g. juan.delacruz@example.com"
            required
          >
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save student</button>
        <a href="{{ url_for('students_page') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
